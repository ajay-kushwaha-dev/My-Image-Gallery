<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="gallery-container">
        <h1>My Image Gallery</h1>
        <div class="gallery-grid">
            <div class="gallery-item"><img src="images/img1.jpeg" alt="Nature"></div>
            <div class="gallery-item"><img src="images/img2.jpeg" alt="Architecture"></div>
            <div class="gallery-item"><img src="images/img3.jpeg" alt="Travel"></div>
            <div class="gallery-item"><img src="images/img4.jpeg" alt="Tech"></div>
            <div class="gallery-item"><img src="images/img5.jpeg" alt="Animals"></div>
            <div class="gallery-item"><img src="images/img6.jpeg" alt="Food"></div>
            <div class="gallery-item"><img src="images/img7.jpeg" alt="Nature"></div>
            <div class="gallery-item"><img src="images/img8.jpeg" alt="Architecture"></div>
        </div>
    </div>

    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="close-btn">&times;</span>
        <button class="nav-btn prev-btn" id="prev-btn">&#10094;</button>
        <img class="lightbox-img" id="lightbox-img" src="" alt="">
        <button class="nav-btn next-btn" id="next-btn">&#10095;</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
